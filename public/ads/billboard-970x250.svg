<svg xmlns="http://www.w3.org/2000/svg" width="970" height="250" viewBox="0 0 970 250" role="img" aria-label="Pasang Iklan di Lensaplus — Media Berita Digital Nasional Indonesia">
  <defs>
    <linearGradient id="bg-billboard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0A45" />
      <stop offset="55%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="cta-billboard" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="970" height="250" fill="url(#bg-billboard)" />
  <rect x="0" y="0" width="970" height="5" fill="#10B981" />
  <rect x="0" y="245" width="970" height="5" fill="#10B981" opacity="0.35" />
  <line x1="276" y1="36" x2="276" y2="214" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />

  <!-- Lensaplus Emblem + Wordmark -->
  <g transform="translate(56, 76)">
    <circle cx="48" cy="48" r="44" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2" />
    <circle cx="48" cy="48" r="28" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.92" />
    <circle cx="48" cy="48" r="14" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="2.4" />
    <path d="M48 36V60M36 48H60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <text x="108" y="45" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" fill="#FFFFFF">Lensaplus</text>
    <text x="108" y="67" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="11" letter-spacing="1.4" fill="#6EE7B7">MEDIA NASIONAL</text>
  </g>

  <!-- Editorial Headline -->
  <text x="310" y="54" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#6EE7B7">PASANG IKLAN &amp; KERJASAMA MEDIA</text>
  <text x="310" y="96" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#FFFFFF">Jangkau Pembaca Nasional</text>
  <text x="310" y="132" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#A7F3D0">di Portal Berita Tepercaya</text>
  <text x="310" y="166" font-family="Inter, Arial, sans-serif" font-size="14" fill="#E9E5F5">Banner display, advertorial jurnalistik, dan kemitraan instansi — terukur &amp; transparan.</text>
  <text x="310" y="206" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12" fill="#DDD6FE">Politik · Hukum · Bisnis &amp; Ekonomi · Pemerintahan · Olahraga · Teknologi</text>

  <!-- Primary CTA -->
  <rect x="716" y="88" width="214" height="74" rx="10" fill="url(#cta-billboard)" />
  <text x="823" y="121" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Minta Penawaran</text>
  <text x="823" y="144" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="500" font-size="12" fill="#ECFDF5">lensaplus.com/pasang-iklan →</text>
</svg>
