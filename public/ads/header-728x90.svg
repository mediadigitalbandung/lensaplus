      <stop offset="0%" stop-color="#1E0A45" />
      <stop offset="65%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
  </defs>
  <rect width="728" height="90" fill="url(#bg-header)" />
  <rect x="0" y="0" width="5" height="90" fill="#10B981" />

