<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-label="Pasang Iklan Anda di Lensaplus">
  <defs>
    <linearGradient id="bg-popup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E0A45" />
      <stop offset="55%" stop-color="#2E1065" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="cta-popup" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-popup)" />
  <rect x="0" y="0" width="600" height="6" fill="#10B981" />

  <!-- Lensaplus Emblem + Brand -->
  <g transform="translate(216, 36)">
    <circle cx="22" cy="22" r="21" fill="#111111" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />
    <circle cx="22" cy="22" r="13" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.92" />
    <circle cx="22" cy="22" r="6.5" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-width="1.6" />
    <path d="M22 16.5V27.5M16.5 22H27.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="56" y="30" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="24" fill="#FFFFFF">Lensaplus</text>
  </g>

  <line x1="120" y1="98" x2="480" y2="98" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1" />

  <!-- High-Contrast Headline (white & bright emerald on deep amethyst) -->
  <text x="300" y="144" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#FFFFFF">Pasang Iklan Anda</text>
  <text x="300" y="180" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="28" fill="#6EE7B7">di Lensaplus Sekarang</text>

  <text x="300" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#E9E5F5">Media berita digital nasional Indonesia yang kredibel —</text>
  <text x="300" y="237" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#E9E5F5">jangkau pembaca tepercaya secara mudah, cepat, dan terukur.</text>

  <!-- Key Highlights (clean editorial text without colored pills) -->
  <text x="300" y="274" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="0.6" fill="#A7F3D0">HASIL TERUKUR  ·  TARIF FLEKSIBEL  ·  SETUP CEPAT</text>

  <!-- Primary CTA -->
  <rect x="108" y="302" width="384" height="58" rx="10" fill="url(#cta-popup)" />
  <text x="300" y="328" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">Hubungi Tim Iklan Lensaplus</text>
  <text x="300" y="348" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#ECFDF5">lensaplus.com/pasang-iklan →</text>
</svg>
